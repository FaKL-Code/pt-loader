name: Publish package to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            'main' || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Prepare release version
        id: release
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag || '' }}
        run: |
          if [[ "$RELEASE_EVENT" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            package_name="$(node -p "require('./package.json').name")"
            latest="$(npm view "$package_name" version)"
            version="$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              if (![major, minor, patch].every(Number.isInteger)) process.exit(1);
              console.log(`${major}.${minor}.${patch + 1}`);
            ' "$latest")"
            tag="v$version"
          else
            tag="${MANUAL_TAG:-$GITHUB_REF_NAME}"
            version="${tag#v}"
          fi

          npm version "$version" --no-git-tag-version --allow-same-version

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release
        run: npm run check

      - name: Check npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"

      - name: Test and publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
