name: Publish package to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            'main' || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Prepare release version
        id: release
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag || '' }}
        run: |
          if [[ "$RELEASE_EVENT" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            npm version patch --no-git-tag-version
            version="$(node -p "require('./package.json').version")"
            tag="v$version"
          else
            tag="${MANUAL_TAG:-$GITHUB_REF_NAME}"
            version="$(node -p "require('./package.json').version")"
            expected="v$version"
            test "$expected" = "$tag" || {
              echo "Tag $tag does not match package version $expected" >&2
              exit 1
            }
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release
        run: npm run check

      - name: Commit and tag automatic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): $RELEASE_TAG [skip ci]"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin HEAD:main
          git push origin "$RELEASE_TAG"

      - name: Check npm publish token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"

      - name: Test and publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
